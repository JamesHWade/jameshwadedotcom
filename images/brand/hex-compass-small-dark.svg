<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="James H Wade Hex-Compass mark (dark)">
  <!-- Connected pointy-top hexagon in warm starlight cream -->
  <polygon points="32,4.5 55.8,18.25 55.8,45.75 32,59.5 8.2,45.75 8.2,18.25"
           fill="#162531" stroke="#FAF2DF" stroke-width="3.6" stroke-linejoin="miter"/>

  <!-- Three alternating aromatic double-bond accent bars -->
  <line x1="14.2" y1="20.6" x2="29" y2="12.1" stroke="#42E3AC" stroke-width="3" stroke-linecap="butt"/>
  <line x1="49.8" y1="23.4" x2="49.8" y2="40.6" stroke="#54D2E8" stroke-width="3" stroke-linecap="butt"/>
  <line x1="29" y1="51.9" x2="14.2" y2="43.4" stroke="#F7B538" stroke-width="3" stroke-linecap="butt"/>

  <!-- Faceted 4-point concave compass star -->
  <polygon points="32,12 32,32 17,32 27.8,27.8" fill="#F46E57"/>
  <polygon points="32,12 36.2,27.8 47,32 32,32" fill="#C9462E"/>
  <polygon points="32,52 27.8,36.2 17,32 32,32" fill="#42E3AC"/>
  <polygon points="32,52 32,32 47,32 36.2,36.2" fill="#FAF2DF"/>
  <circle cx="32" cy="32" r="2.2" fill="#101B24"/>
</svg>
