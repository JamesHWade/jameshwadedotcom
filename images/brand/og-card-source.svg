<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Warm Daylight Survey Parchment Background -->
  <rect width="1200" height="630" fill="#FBF5E6"/>
  <!-- Outer Printed Border -->
  <rect x="28" y="34" width="1144" height="568" fill="#FFFDF7" stroke="#243942" stroke-width="3"/>

  <!-- 5-Color Geological Strata Top Ribbon -->
  <rect x="0" y="0" width="240" height="14" fill="#19684B"/>
  <rect x="240" y="0" width="240" height="14" fill="#0D7A87"/>
  <rect x="480" y="0" width="240" height="14" fill="#C97D10"/>
  <rect x="720" y="0" width="240" height="14" fill="#C9462E"/>
  <rect x="960" y="0" width="240" height="14" fill="#7E3661"/>

  <!-- Subtle Right-Side Topographic Contours -->
  <g stroke="#E3D9C4" stroke-width="2" fill="none">
    <ellipse cx="940" cy="318" rx="220" ry="205"/>
    <ellipse cx="940" cy="318" rx="172" ry="158" stroke-dasharray="7 6"/>
    <ellipse cx="940" cy="318" rx="126" ry="114"/>
  </g>

  <!-- Right-Side Engraved Hex-Compass Emblem -->
  <g transform="translate(765, 142) scale(1.75)">
    <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" fill="#FBF5E6" stroke="#16262E" stroke-width="6.5"/>
    <line x1="36" y1="62" x2="94" y2="28.5" stroke="#19684B" stroke-width="5.5"/>
    <line x1="164" y1="66" x2="164" y2="134" stroke="#0D7A87" stroke-width="5.5"/>
    <line x1="94" y1="171.5" x2="36" y2="138" stroke="#C97D10" stroke-width="5.5"/>
    <circle cx="100" cy="100" r="50" stroke="#16262E" stroke-width="1.8"/>
    <circle cx="100" cy="100" r="44" stroke="#16262E" stroke-width="1.2" stroke-dasharray="1.6 3.9"/>
    <rect x="92" y="42" width="16" height="14" fill="#FBF5E6"/>
    <rect x="92" y="144" width="16" height="14" fill="#FBF5E6"/>
    <rect x="143" y="92" width="14" height="16" fill="#FBF5E6"/>
    <rect x="43" y="92" width="14" height="16" fill="#FBF5E6"/>
    <text x="100" y="53" text-anchor="middle" fill="#C9462E" font-family="Georgia, serif" font-size="13" font-weight="700">N</text>
    <text x="100" y="156" text-anchor="middle" fill="#19684B" font-family="Georgia, serif" font-size="13" font-weight="700">S</text>
    <text x="150" y="104.5" text-anchor="middle" fill="#16262E" font-family="Georgia, serif" font-size="12" font-weight="700">E</text>
    <text x="49.5" y="104.5" text-anchor="middle" fill="#16262E" font-family="Georgia, serif" font-size="12" font-weight="700">W</text>
    <polygon points="100,100 124,76 105,100" fill="#16262E"/>
    <polygon points="100,100 124,76 100,95" fill="#FBF5E6" stroke="#16262E" stroke-width="1.1"/>
    <polygon points="100,100 124,124 100,105" fill="#16262E"/>
    <polygon points="100,100 124,124 105,100" fill="#FBF5E6" stroke="#16262E" stroke-width="1.1"/>
    <polygon points="100,100 76,124 95,100" fill="#16262E"/>
    <polygon points="100,100 76,124 100,105" fill="#FBF5E6" stroke="#16262E" stroke-width="1.1"/>
    <polygon points="100,100 76,76 100,95" fill="#16262E"/>
    <polygon points="100,100 76,76 95,100" fill="#FBF5E6" stroke="#16262E" stroke-width="1.1"/>
    <polygon points="100,100 140,100 100,93" fill="#FBF5E6" stroke="#16262E" stroke-width="1.3"/>
    <polygon points="100,100 140,100 100,107" fill="#16262E"/>
    <polygon points="100,100 60,100 100,107" fill="#FBF5E6" stroke="#16262E" stroke-width="1.3"/>
    <polygon points="100,100 60,100 100,93" fill="#16262E"/>
    <polygon points="100,58 100,100 92.5,100" fill="#FBF5E6" stroke="#C9462E" stroke-width="1.3"/>
    <polygon points="100,58 107.5,100 100,100" fill="#C9462E"/>
    <polygon points="100,142 100,100 92.5,100" fill="#19684B"/>
    <polygon points="100,142 107.5,100 100,100" fill="#FBF5E6" stroke="#19684B" stroke-width="1.3"/>
    <circle cx="100" cy="100" r="3.5" fill="#C97D10" stroke="#16262E" stroke-width="1.4"/>
  </g>

  <!-- Left Editorial Typography -->
  <text x="86" y="218" fill="#16262E" font-family="Georgia, 'Iowan Old Style', serif" font-size="76" font-weight="700" letter-spacing="-1">James H. Wade</text>

  <text x="86" y="288" fill="#435760" font-family="Georgia, 'Iowan Old Style', serif" font-size="30">Analytical chemistry, Shiny apps,</text>
  <text x="86" y="330" fill="#435760" font-family="Georgia, 'Iowan Old Style', serif" font-size="30">and R packages for language models.</text>

  <!-- Colored Package Tags -->
  <g font-family="Menlo, Monaco, monospace" font-size="17" font-weight="700">
    <rect x="86" y="408" width="128" height="38" fill="#E0F1E8" stroke="#19684B" stroke-width="2"/>
    <text x="150" y="433" text-anchor="middle" fill="#19684B">measure</text>

    <rect x="228" y="408" width="136" height="38" fill="#FCE6E1" stroke="#C9462E" stroke-width="2"/>
    <text x="296" y="433" text-anchor="middle" fill="#C9462E">shinymcp</text>

    <rect x="378" y="408" width="116" height="38" fill="#FDF0D5" stroke="#B56E0C" stroke-width="2"/>
    <text x="436" y="433" text-anchor="middle" fill="#B56E0C">deputy</text>

    <rect x="508" y="408" width="116" height="38" fill="#DDF2F4" stroke="#0D7A87" stroke-width="2"/>
    <text x="566" y="433" text-anchor="middle" fill="#0D7A87">dsprrr</text>
  </g>

  <!-- Footer Coordinate Bar -->
  <line x1="86" y1="508" x2="710" y2="508" stroke="#D8CEB8" stroke-width="2"/>
  <text x="86" y="548" fill="#19684B" font-family="Menlo, Monaco, monospace" font-size="20" font-weight="700">jameshwade.com</text>
  <text x="340" y="548" fill="#697B82" font-family="Menlo, Monaco, monospace" font-size="18">Mid-Michigan · R · Python · Shiny</text>
</svg>
