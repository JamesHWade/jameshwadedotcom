<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="James H Wade Hex-Compass mark (light)">
  <!-- Open-corner monoline hexagon (benzene ring x R package hex) -->
  <g stroke="#16262E" stroke-width="3.2" stroke-linecap="butt">
    <line x1="35.5" y1="6" x2="52.8" y2="16"/>
    <line x1="56.2" y1="22" x2="56.2" y2="42"/>
    <line x1="52.8" y1="48" x2="35.5" y2="58"/>
    <line x1="28.5" y1="58" x2="11.2" y2="48"/>
    <line x1="7.8" y1="42" x2="7.8" y2="22"/>
    <line x1="11.2" y1="16" x2="28.5" y2="6"/>
  </g>

  <!-- Three alternating aromatic double-bond accent bars -->
  <line x1="13.8" y1="20.4" x2="28.5" y2="11.9" stroke="#19684B" stroke-width="2.8" stroke-linecap="butt"/>
  <line x1="50.4" y1="23.5" x2="50.4" y2="40.5" stroke="#0D7A87" stroke-width="2.8" stroke-linecap="butt"/>
  <line x1="28.5" y1="52.1" x2="13.8" y2="43.6" stroke="#C97D10" stroke-width="2.8" stroke-linecap="butt"/>

  <!-- Sleek 4-point concave faceted compass star (matching Direction C) -->
  <!-- Upper half: bright terracotta left, deep copper right -->
  <polygon points="32,10 32,32 16,32 27.5,27.5" fill="#DC583D"/>
  <polygon points="32,10 36.5,27.5 48,32 32,32" fill="#B53822"/>
  <!-- Lower half: warm pine/ivory left, deep evergreen slate right -->
  <polygon points="32,54 27.5,36.5 16,32 32,32" fill="#19684B"/>
  <polygon points="32,54 32,32 48,32 36.5,36.5" fill="#16262E"/>
  <!-- Tiny center brass glint -->
  <circle cx="32" cy="32" r="2.2" fill="#FBF5E6"/>
</svg>
