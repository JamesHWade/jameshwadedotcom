<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" role="img" aria-label="James H Wade Engraved Hex-Compass seal (dark)">
  <defs>
    <clipPath id="hex-clip-dark">
      <polygon points="100,12 176,56 176,144 100,188 24,144 24,56"/>
    </clipPath>
  </defs>

  <!-- Midnight slate hexagon ground + subtle topo contours -->
  <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" fill="#162531"/>
  <g clip-path="url(#hex-clip-dark)" stroke="#264152" stroke-width="1.2" fill="none">
    <path d="M 10 52 Q 65 24 118 50 T 195 44"/>
    <path d="M 10 80 Q 60 54 112 78 T 195 72"/>
    <path d="M 10 132 Q 68 110 125 138 T 195 126"/>
    <path d="M 10 162 Q 72 142 132 166 T 195 154"/>
    <circle cx="100" cy="100" r="64" stroke="#223A4A" stroke-width="1"/>
  </g>

  <!-- Bold outer hexagon border -->
  <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" fill="none" stroke="#FAF2DF" stroke-width="6.5" stroke-linejoin="miter"/>

  <!-- Three alternating aromatic double-bond accent bars -->
  <line x1="36" y1="62" x2="94" y2="28.5" stroke="#42E3AC" stroke-width="5.5"/>
  <line x1="164" y1="66" x2="164" y2="134" stroke="#54D2E8" stroke-width="5.5"/>
  <line x1="94" y1="171.5" x2="36" y2="138" stroke="#F7B538" stroke-width="5.5"/>

  <!-- Fine engraved compass bezel -->
  <circle cx="100" cy="100" r="50" stroke="#FAF2DF" stroke-width="1.8"/>
  <circle cx="100" cy="100" r="44" stroke="#9CB6C4" stroke-width="1.2" stroke-dasharray="1.6 3.9"/>
  <circle cx="100" cy="100" r="35" stroke="#2B4252" stroke-width="1.2"/>

  <!-- Cardinal Letters -->
  <rect x="92" y="42" width="16" height="14" fill="#162531"/>
  <rect x="92" y="144" width="16" height="14" fill="#162531"/>
  <rect x="143" y="92" width="14" height="16" fill="#162531"/>
  <rect x="43" y="92" width="14" height="16" fill="#162531"/>
  <text x="100" y="53" text-anchor="middle" fill="#F46E57" font-family="Georgia, serif" font-size="13" font-weight="700">N</text>
  <text x="100" y="156" text-anchor="middle" fill="#42E3AC" font-family="Georgia, serif" font-size="13" font-weight="700">S</text>
  <text x="150" y="104.5" text-anchor="middle" fill="#FAF2DF" font-family="Georgia, serif" font-size="12" font-weight="700">E</text>
  <text x="49.5" y="104.5" text-anchor="middle" fill="#FAF2DF" font-family="Georgia, serif" font-size="12" font-weight="700">W</text>

  <!-- Secondary Diagonal Rose Points -->
  <g stroke="#FAF2DF" stroke-width="1.1" stroke-linejoin="round">
    <polygon points="100,100 124,76 105,100" fill="#FAF2DF"/>
    <polygon points="100,100 124,76 100,95" fill="#162531"/>
    <polygon points="100,100 124,124 100,105" fill="#FAF2DF"/>
    <polygon points="100,100 124,124 105,100" fill="#162531"/>
    <polygon points="100,100 76,124 95,100" fill="#FAF2DF"/>
    <polygon points="100,100 76,124 100,105" fill="#162531"/>
    <polygon points="100,100 76,76 100,95" fill="#FAF2DF"/>
    <polygon points="100,100 76,76 95,100" fill="#162531"/>
  </g>

  <!-- Primary 4-Point Faceted Compass Rose -->
  <polygon points="100,100 140,100 100,93" fill="#162531" stroke="#FAF2DF" stroke-width="1.3"/>
  <polygon points="100,100 140,100 100,107" fill="#FAF2DF"/>
  <polygon points="100,100 60,100 100,107" fill="#162531" stroke="#FAF2DF" stroke-width="1.3"/>
  <polygon points="100,100 60,100 100,93" fill="#FAF2DF"/>
  <!-- North (Coral-Copper) -->
  <polygon points="100,58 100,100 92.5,100" fill="#F46E57"/>
  <polygon points="100,58 107.5,100 100,100" fill="#C9462E"/>
  <!-- South (Aurora) -->
  <polygon points="100,142 100,100 92.5,100" fill="#42E3AC"/>
  <polygon points="100,142 107.5,100 100,100" fill="#162531" stroke="#42E3AC" stroke-width="1.3"/>

  <circle cx="100" cy="100" r="3.5" fill="#F7B538" stroke="#101B24" stroke-width="1.4"/>
</svg>
