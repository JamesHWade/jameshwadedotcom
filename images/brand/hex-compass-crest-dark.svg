<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 264" width="240" height="264" fill="none" role="img" aria-label="James H Wade Mid-Michigan Hex-Compass crest with geosmin molecule (dark)">
  <defs>
    <clipPath id="crest-clip-dark">
      <polygon points="120,16 218,73 218,191 120,248 22,191 22,73"/>
    </clipPath>
  </defs>

  <!-- Outer Starlight Frame + Amber Trim -->
  <polygon points="120,8 225,69 225,195 120,256 15,195 15,69" fill="#FAF2DF"/>
  <polygon points="120,14 220,72 220,192 120,250 20,192 20,72" fill="#F7B538"/>
  <polygon points="120,18 216,74 216,190 120,246 24,190 24,74" fill="#101B24"/>

  <g clip-path="url(#crest-clip-dark)">
    <!-- Subtle Compass Halo behind Geosmin -->
    <circle cx="120" cy="70" r="43" stroke="#2B4252" stroke-width="1.3" stroke-dasharray="3 3"/>

    <!-- (-)-Geosmin: (4S,4aS,8aR)-4,8a-dimethyloctahydronaphthalen-4a(2H)-ol -->
    <g stroke="#FAF2DF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="120,54 101,43 82,54 82,76 101,87 120,76"/>
      <polyline points="120,54 139,43 158,54 158,76 139,87 120,76"/>
      <line x1="120" y1="54" x2="120" y2="76"/>
    </g>

    <!-- C8a-CH3 (8aR): Solid Wedge pointing UP -->
    <polygon points="120,54 117.2,35 122.8,35" fill="#FAF2DF"/>

    <!-- C4a-OH (4aS): Hashed/Dashed Bond pointing DOWN -->
    <g stroke="#F46E57" stroke-width="1.8" stroke-linecap="round">
      <line x1="118.8" y1="80" x2="121.2" y2="80"/>
      <line x1="118.1" y1="83.5" x2="121.9" y2="83.5"/>
      <line x1="117.4" y1="87" x2="122.6" y2="87"/>
      <line x1="116.7" y1="90.5" x2="123.3" y2="90.5"/>
    </g>
    <text x="120" y="103" text-anchor="middle" fill="#F46E57" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="700">OH</text>

    <!-- C4-CH3 (4S): Hashed/Dashed Bond pointing DOWN-RIGHT -->
    <g stroke="#FAF2DF" stroke-width="1.7" stroke-linecap="round">
      <line x1="141.2" y1="90.6" x2="143.2" y2="88.6"/>
      <line x1="143.5" y1="93.8" x2="146.3" y2="91.0"/>
      <line x1="145.8" y1="97.0" x2="149.4" y2="93.4"/>
      <line x1="148.1" y1="100.2" x2="152.5" y2="95.8"/>
    </g>

    <!-- Starlight Sparks -->
    <g fill="#F7B538">
      <polygon points="48,74 50,79 55,81 50,83 48,88 46,83 41,81 46,79"/>
      <polygon points="192,74 194,79 199,81 194,83 192,88 190,83 185,81 190,79"/>
      <circle cx="64" cy="100" r="1.7" fill="#FAF2DF"/>
      <circle cx="176" cy="100" r="1.7" fill="#FAF2DF"/>
      <circle cx="96" cy="34" r="1.4" fill="#42E3AC"/>
      <circle cx="144" cy="34" r="1.4" fill="#54D2E8"/>
    </g>

    <!-- Deep Aurora Pine Hills -->
    <path d="M 18 148 Q 52 126 86 144 T 156 138 T 224 128 L 224 202 L 18 202 Z" fill="#153B32" stroke="#42E3AC" stroke-width="1.6"/>
    <g stroke="#296857" stroke-width="1.4" fill="none">
      <path d="M 18 160 Q 54 142 92 158 T 164 152 T 224 144"/>
      <path d="M 18 172 Q 58 156 98 170 T 170 165 T 224 158"/>
      <path d="M 18 184 Q 62 170 104 182 T 178 178 T 224 172"/>
    </g>

    <g fill="#0A1815">
      <polygon points="44,122 37,140 51,140"/>
      <polygon points="62,128 56,143 68,143"/>
      <polygon points="82,135 77,147 87,147"/>
      <polygon points="160,132 155,144 165,144"/>
      <polygon points="178,125 172,140 184,140"/>
      <polygon points="196,118 189,136 203,136"/>
    </g>

    <!-- Midnight Great Lakes Waves -->
    <path d="M 18 186 Q 38 174 58 186 T 98 186 T 138 186 T 178 186 T 224 186 L 224 252 L 18 252 Z" fill="#0B3340" stroke="#54D2E8" stroke-width="1.6"/>
    <g stroke="#54D2E8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M 30 198 Q 48 190 66 198 T 102 198 T 138 198 T 174 198 T 210 198"/>
      <path d="M 44 210 Q 62 203 80 210 T 116 210 T 152 210 T 188 210"/>
      <path d="M 66 222 Q 86 216 106 222 T 146 222 T 174 222"/>
    </g>

    <!-- Luminous Faceted Compass Needle -->
    <g stroke="#101B24" stroke-width="2" stroke-linejoin="round">
      <polygon points="120,117 120,166 107,166" fill="#F46E57"/>
      <polygon points="120,117 133,166 120,166" fill="#C9462E"/>
      <polygon points="120,217 107,166 120,166" fill="#F7B538"/>
      <polygon points="120,217 120,166 133,166" fill="#C97D10"/>
      <polygon points="120,158 126,166 120,174 114,166" fill="#FAF2DF"/>
    </g>

    <text x="120" y="238" text-anchor="middle" fill="#FAF2DF" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.5">JHW</text>
  </g>
</svg>
