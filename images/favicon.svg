<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    .bg   { fill: #FBF5E6; }
    .hex  { fill: #FFFDF7; stroke: #16262E; }
    .pine { stroke: #19684B; }
    .lake { stroke: #0D7A87; }
    .ochre{ stroke: #C97D10; }
