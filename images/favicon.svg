  <line class="lake" x1="24.6" y1="11.8" x2="24.6" y2="20.2" stroke-width="1.6"/>
  <line class="ochre" x1="14.5" y1="25.6" x2="7.4" y2="21.5" stroke-width="1.6"/>
  <polygon class="nw" points="16,6.2 16,16 8.5,16 13.8,13.8"/>
  <polygon class="ne" points="16,6.2 18.2,13.8 23.5,16 16,16"/>
  <polygon class="sw" points="16,25.8 13.8,18.2 8.5,16 16,16"/>
  <polygon class="se" points="16,25.8 16,16 23.5,16 18.2,18.2"/>
