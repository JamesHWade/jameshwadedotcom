<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    .bg   { fill: #FBF5E6; }
    .hex  { stroke: #16262E; }
    .pine { stroke: #19684B; }
    .lake { stroke: #0D7A87; }
    .ochre{ stroke: #C97D10; }
    .nw   { fill: #DC583D; }
    .ne   { fill: #B53822; }
    .sw   { fill: #19684B; }
    .se   { fill: #16262E; }
    .dot  { fill: #FBF5E6; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #101B24; }
      .hex  { stroke: #FAF2DF; }
      .pine { stroke: #42E3AC; }
      .lake { stroke: #54D2E8; }
      .ochre{ stroke: #F7B538; }
      .nw   { fill: #F46E57; }
      .ne   { fill: #C9462E; }
      .sw   { fill: #42E3AC; }
      .se   { fill: #FAF2DF; }
      .dot  { fill: #101B24; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <g class="hex" stroke-width="2" stroke-linecap="butt">
    <line x1="18" y1="3.4" x2="26.2" y2="8.2"/>
    <line x1="28" y1="11.2" x2="28" y2="20.8"/>
    <line x1="26.2" y1="23.8" x2="18" y2="28.6"/>
    <line x1="14" y1="28.6" x2="5.8" y2="23.8"/>
    <line x1="4" y1="20.8" x2="4" y2="11.2"/>
    <line x1="5.8" y1="8.2" x2="14" y2="3.4"/>
  </g>
  <line class="pine" x1="7.2" y1="10.4" x2="14.2" y2="6.3" stroke-width="1.6"/>
  <line class="lake" x1="25" y1="12" x2="25" y2="20" stroke-width="1.6"/>
  <line class="ochre" x1="14.2" y1="25.7" x2="7.2" y2="21.6" stroke-width="1.6"/>
  <polygon class="nw" points="16,5 16,16 8,16 13.7,13.7"/>
  <polygon class="ne" points="16,5 18.3,13.7 24,16 16,16"/>
  <polygon class="sw" points="16,27 13.7,18.3 8,16 16,16"/>
  <polygon class="se" points="16,27 16,16 24,16 18.3,18.3"/>
  <circle class="dot" cx="16" cy="16" r="1.1"/>
