  <rect class="bg" width="32" height="32" rx="6"/>
  <polygon class="hex" points="16,2.8 27.4,9.4 27.4,22.6 16,29.2 4.6,22.6 4.6,9.4" stroke-width="2.1" stroke-linejoin="miter"/>
